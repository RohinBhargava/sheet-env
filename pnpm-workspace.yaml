allowBuilds:
  '@biomejs/biome': false
  '@scarf/scarf': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sqlite3: true
  ssh2: true
  tldjs: true
  unrs-resolver: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
- '@forklaunch/*'
overrides:
  '@forklaunch/better-auth-mikro-orm-fork': 0.5.12
  '@forklaunch/bunrun': 1.2.25
  '@forklaunch/common': 1.2.32
  '@forklaunch/core': 3.3.0
  '@forklaunch/express': 1.2.53
  '@forklaunch/hyper-express': 1.2.51
  '@forklaunch/implementation-billing-base': 1.1.0
  '@forklaunch/implementation-billing-stripe': 1.3.0
  '@forklaunch/implementation-ecommerce-base': 1.0.16
  '@forklaunch/implementation-ecommerce-paypal': 1.0.10
  '@forklaunch/implementation-ecommerce-stripe': 1.1.0
  '@forklaunch/implementation-iam-base': 1.0.43
  '@forklaunch/implementation-messaging-base': 1.1.10
  '@forklaunch/implementation-messaging-twilio': 1.1.10
  '@forklaunch/implementation-cac-base': 0.2.9
  '@forklaunch/implementation-worker-bullmq': 1.0.41
  '@forklaunch/implementation-worker-redis': 1.0.40
  '@forklaunch/implementation-worker-database': 1.1.0
  '@forklaunch/implementation-worker-kafka': 1.0.41
  '@forklaunch/infrastructure-redis': 1.4.22
  '@forklaunch/infrastructure-s3': 1.5.4
  '@forklaunch/interfaces-billing': 1.0.40
  '@forklaunch/interfaces-ecommerce': 1.0.14
  '@forklaunch/interfaces-iam': 1.0.39
  '@forklaunch/interfaces-messaging': 1.1.8
  '@forklaunch/interfaces-cac': 0.2.8
  '@forklaunch/interfaces-worker': 1.0.37
  '@forklaunch/internal': 1.2.35
  '@forklaunch/testing': 1.3.0
  '@forklaunch/universal-sdk': 1.4.1
  '@forklaunch/validator': 1.3.0
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
- build
packages:
- src/client-sdk/typescript
- src/client-sdk/events/typescript
- src/*/events/typescript
- src/*/sdk/typescript
- src/*
# src/web installs on its own (see src/web/pnpm-workspace.yaml).
- '!src/web'
