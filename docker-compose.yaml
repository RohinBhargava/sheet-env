volumes:
  minio-data:
    driver: local
  mimir-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  sheet-env-postgresql-data:
    driver: local
networks:
  sheet-env-network:
    name: sheet-env-network
    driver: bridge
services:
  minio:
    container_name: sheet-env-minio
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    networks:
    - sheet-env-network
    volumes:
    - minio-data:/data
    command: server /data --console-address :9001
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    environment: {}
    depends_on:
      minio:
        condition: service_healthy
    networks:
    - sheet-env-network
    entrypoint: /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/forklaunch-telemetry"
  tempo:
    image: grafana/tempo:3.0.0
    environment: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:3200:3200
    networks:
    - sheet-env-network
    volumes:
    - ./src/monitoring/tempo.yaml:/etc/tempo.yaml
    - tempo-data:/var/tempo
    command: -target=all -config.file=/etc/tempo.yaml
    healthcheck:
      test:
      - CMD
      - /tempo
      - -health
      - -health.url=http://localhost:3200/ready
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  loki:
    image: grafana/loki:3.7.7
    environment: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:3100:3100
    networks:
    - sheet-env-network
    volumes:
    - ./src/monitoring/loki.yaml:/etc/loki/local-config.yaml
    - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
  mimir:
    image: grafana/mimir:3.2.0
    environment: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    ports:
    - 127.0.0.1:9090:9090
    networks:
    - sheet-env-network
    volumes:
    - ./src/monitoring/mimir.yaml:/etc/mimir/mimir.yaml
    - mimir-data:/data
    command: -config.file=/etc/mimir/mimir.yaml
  memcached:
    image: memcached:1.6-alpine
    environment: {}
    networks:
    - sheet-env-network
    command: -m 64
  grafana:
    image: grafana/grafana:12.3.1
    environment: {}
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - sheet-env-network
    volumes:
    - ./src/monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    - ./src/monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    environment: {}
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
    - 127.0.0.1:4317:4317
    - 127.0.0.1:4318:4318
    - 127.0.0.1:13133:13133
    networks:
    - sheet-env-network
    volumes:
    - ./src/monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: --config=/etc/otel-collector-config.yaml
  workbooks:
    hostname: workbooks
    container_name: sheet-env-workbooks-rust
    image: sheet-env-rust:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.rust
    environment:
      HOST: 0.0.0.0
      PROTOCOL: http
      VERSION: v1
      DOCS_PATH: /docs
      RUST_LOG: info
      PORT: '8000'
      MCP_ENABLED: 'true'
      PUBLIC_ORIGIN: http://localhost:8000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost}
      DATABASE_URL: ${WORKBOOKS_DATABASE_URL:?Configure a restricted service PostgreSQL role}
      TENANT_ID: ${WORKBOOKS_TENANT_ID:?Configure a trusted tenant UUID}
      STORAGE_ENCRYPTION_NAMESPACE: ${WORKBOOKS_STORAGE_ENCRYPTION_NAMESPACE:?Configure a stable service storage namespace}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:?Configure encryption key}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
      ENCRYPTION_LEGACY_KEY_HEX: ${ENCRYPTION_LEGACY_KEY_HEX:-disabled}
      DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT: ${DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      workbooks-migrate:
        condition: service_completed_successfully
    ports:
    - 8000:8000
    networks:
    - sheet-env-network
    working_dir: /app
    command:
    - /app/bin/workbooks
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgresql:
    hostname: postgresql
    container_name: sheet-env-postgresql
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
    - 127.0.0.1:5432:5432
    networks:
    - sheet-env-network
    volumes:
    - sheet-env-postgresql-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgresql -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgresql-provision:
    image: postgres:latest
    restart: no
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
    - sheet-env-network
    entrypoint:
    - sh
    - -c
    command:
    - |
      set -eu
      psql -v ON_ERROR_STOP=1 -h postgresql -U postgresql -d postgres <<'SQL'
      SELECT format('CREATE ROLE %I LOGIN', name) FROM unnest(ARRAY['workbooks_owner', 'workbooks_app']) AS name WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = name)\gexec
      SELECT format('CREATE DATABASE %I OWNER %I', 'sheet_env_workbooks', 'workbooks_owner') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sheet_env_workbooks')\gexec
      SQL
      psql -v ON_ERROR_STOP=1 -h postgresql -U postgresql -d 'sheet_env_workbooks' <<'SQL'
      ALTER SCHEMA public OWNER TO workbooks_owner;
      ALTER DEFAULT PRIVILEGES FOR ROLE workbooks_owner GRANT USAGE ON SCHEMAS TO workbooks_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE workbooks_owner GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO workbooks_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE workbooks_owner GRANT USAGE, SELECT ON SEQUENCES TO workbooks_app;
      SELECT format('GRANT USAGE ON SCHEMA %I TO %I', nspname, 'workbooks_app') FROM pg_namespace WHERE nspowner = 'workbooks_owner'::regrole\gexec
      SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', nspname, 'workbooks_app') FROM pg_namespace WHERE nspowner = 'workbooks_owner'::regrole\gexec
      SELECT format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', nspname, 'workbooks_app') FROM pg_namespace WHERE nspowner = 'workbooks_owner'::regrole\gexec
      SQL
  workbooks-migrate:
    image: sheet-env-rust:local
    restart: no
    build:
      context: .
      dockerfile: Dockerfile.rust
    environment:
      HOST: 0.0.0.0
      PROTOCOL: http
      VERSION: v1
      DOCS_PATH: /docs
      RUST_LOG: info
      PORT: '8000'
      MCP_ENABLED: 'true'
      PUBLIC_ORIGIN: http://localhost:8000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost}
      DATABASE_URL: ${WORKBOOKS_MIGRATION_DATABASE_URL:?Configure the migration owner role}
      TENANT_ID: ${WORKBOOKS_TENANT_ID:?Configure a trusted tenant UUID}
      STORAGE_ENCRYPTION_NAMESPACE: ${WORKBOOKS_STORAGE_ENCRYPTION_NAMESPACE:?Configure a stable service storage namespace}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:?Configure encryption key}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
      ENCRYPTION_LEGACY_KEY_HEX: ${ENCRYPTION_LEGACY_KEY_HEX:-disabled}
      DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT: ${DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MIGRATION_DATABASE_URL: ${WORKBOOKS_MIGRATION_DATABASE_URL:?Configure the migration owner role}
    depends_on:
      postgresql-provision:
        condition: service_completed_successfully
    networks:
    - sheet-env-network
    working_dir: /app
    command:
    - /app/bin/workbooks
    - --migrate
