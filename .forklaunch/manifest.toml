language = "mixed"
applicationLanguage = "mixed"
sdkTargets = [
    "typescript",
    "rust",
]
cargoWorkspace = "Cargo.toml"
id = "5e3fadc3-47de-4f04-ab94-06dbab885a2f"
cli_version = "1.33.0"
app_name = "sheet-env"
modules_path = "src"
app_description = "Excel-compatible spreadsheet environment for agents"
linter = "oxlint"
formatter = "prettier"
validator = "zod"
http_framework = "express"
runtime = "node"
test_framework = "vitest"
author = "ForkLaunch"
license = "none"
platform_application_id = "62831d24-120b-46dd-b687-d1cc20f17721"
platform_organization_id = "0dc69b58-4d61-4845-9f76-19710c36a8f9"

[[projects]]
type = "Library"
name = "core"
description = "Core library for sheet-env, containing shared foundational infrastrucuture and utilities"

[[projects]]
type = "Library"
name = "monitoring"
description = "Monitoring library for sheet-env, defining metrics, logs, and trace building blocks"

[[projects]]
type = "Library"
name = "client-sdk"
description = "Client SDK for sheet-env, containing shared foundational infrastrucuture and utilities"

[[projects]]
type = "Service"
name = "workbooks"
description = "Workbook storage, environment controls and agent tools"
routers = [
    "environment",
    "files",
]

[projects.resources]
database = "postgresql"

[projects.metadata]
sdkLayout = "project-local-v1"
language = "rust"
crateName = "workbooks"
cratePath = "src/workbooks"
contractArtifactPath = "src/workbooks/sdk/typescript/contract.json"
openapiPath = "src/workbooks/sdk/typescript/openapi.json"
asyncapiPath = "src/workbooks/sdk/typescript/asyncapi.json"
sdkTargets = [
    "typescript",
    "rust",
]
persistence = "postgresql"

[[projects]]
type = "Library"
name = "web"
description = "ForkLaunch Sheets browser app, served by the workbooks service from workbooks/web-dist"

[project_peer_topology]
sheet-env = [
    "core",
    "monitoring",
    "client-sdk",
    "web",
]

[framework]
version = "0.2.5"
blueprint_version = "0.2.5"
